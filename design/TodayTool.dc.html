<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: inherit; text-decoration: none; }
    a:hover { color: inherit; }
  </style>
</helmet>
<div style="width: 1200px; height: 900px; background: #09090b; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; color: #f4f4f5; display: flex; justify-content: center;">
  <div style="width: 768px; display: flex; flex-direction: column; padding: 0 24px;">

    <div style="padding: 32px 0;">
      <span style="font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 14px; line-height: 20px; color: #a1a1aa;">nsscode.com</span>
    </div>

    <div style="flex-grow: 1; padding-bottom: 64px;">
      <h1 style="margin: 0 0 4px 0; font-size: 24px; line-height: 32px; font-weight: 600;">JSON Formatter</h1>
      <p style="margin: 0 0 32px 0; font-size: 16px; line-height: 24px; color: #a1a1aa;">Pretty-print and validate a blob of JSON.</p>

      <div style="display: flex; flex-direction: column; gap: 16px;">

        <div>
          <div style="margin-bottom: 4px; font-size: 14px; line-height: 20px; color: #a1a1aa;">Input</div>
          <div style="border: 1px solid #27272a; border-radius: 8px; background: #18181b; padding: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 14px; line-height: 20px; height: 160px; color: #f4f4f5;">{"a":{"b":[1,2]}}</div>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; color: #a1a1aa;">
          <span>Indent</span>
          <div style="border: 1px solid #27272a; border-radius: 4px; background: #18181b; padding: 4px 8px; color: #f4f4f5;">2 &#8964;</div>
        </div>

        <div style="border: 1px solid #27272a; border-radius: 8px; background: #18181b; padding: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 14px; line-height: 20px; white-space: pre; color: #f4f4f5;">{
  "a": {
    "b": [
      1,
      2
    ]
  }
}</div>

        <div style="border: 1px solid #7f1d1d; border-radius: 8px; background: #450a0a; padding: 12px; font-size: 14px; line-height: 20px; color: #fca5a5;">Expected property name or '}' in JSON at position 1</div>

      </div>
    </div>

    <div style="padding: 32px 0; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; line-height: 16px; color: #52525b;">source</div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1200,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
